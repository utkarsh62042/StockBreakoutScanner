# Breakout Scanner — Example Configuration
# Copy this file to `config.yaml` and edit values for your setup.
# See `README.md` for explanations of each field.

universe: "nifty500"
data_source: "yfinance"   # or "angelone" / "upstox"

risk:
  capital: 500000
  risk_per_trade_pct: 1.0
  max_concurrent_positions: 8
  max_positions_per_sector: 3
  # Circuit breakers for portfolio health — no new positions opened if triggered
  max_portfolio_loss_pct_daily: 3.0    # Stop if down >3% today (FII selling stress)
  max_portfolio_loss_pct_monthly: 10.0 # Stop if down >10% this month (reset next month)
  # Market stress scaling: reduce position size below baseline when VIX/breadth deteriorates
  scale_positions_in_market_stress: true

scoring_weights:
  pattern_quality: 35
  stage: 20
  relative_strength: 15
  volume: 15
  tightness: 10
  sector: 5

thresholds:
  min_score_to_alert: 60
  min_volume_ratio: 1.5
  volume_saturation_ratio: 3.0
  extension_free_pct: 2.0
  extension_max_pct: 8.0
  extension_max_penalty: 10.0
  min_market_cap_cr: 500
  min_adv_cr: 5
  min_listing_days: 365
  near_breakout_pct: 2.0
  pullback_window_days: 10
  pullback_retest_band_pct: 3.0

pivots:
  swing_n: 5

patterns:
  enabled:
    - fifty_two_week_high        # 52-week high breakout with resistance touches
    - darvas_box                 # Box breakout (parallel highs and lows)
    - nr7                        # Narrow range (NR7) compression breakout
    - inside_bar                 # Inside bar (range contraction) breakout
    - bollinger_squeeze          # Bollinger band squeeze (volatility contraction)
    - ascending_triangle         # Ascending triangle (bullish accumulation)
    - vcp                        # Volatility Contraction Pattern
    - cup_and_handle             # Cup & Handle formation
    - flag                       # Flag pattern (short-term consolidation)

stage_filter:
  sma_weeks: 30
  slope_lookback_weeks: 10
  high_lookback_weeks: 10

output:
  csv: true
  telegram: true
  email: false

paper_trading:
  enabled: true
  hold_max_days: 30
  atr_stop_multiplier: 1.5
  target_1_r_multiple: 2.0

# Market-regime gate: scales position size by NIFTY trend + market breadth +
# India VIX. Never raises size above baseline. See GUIDE § 10.
regime:
  enabled: true
  nifty_symbol: "^NSEI"
  nifty_sma: 200
  nifty_slope_lookback: 20
  breadth_sma: 50
  breadth_up_pct: 60
  breadth_down_pct: 40
  risk_off_multiplier: 0.5
  severe_multiplier: 0.25

# Round-trip transaction costs, netted off every settled trade. Rates are % of
# one leg's turnover; NSE equity delivery. Set enabled: false to see gross P&L.
costs:
  enabled: true
  brokerage_pct: 0.1
  brokerage_max_inr: 20
  stt_pct: 0.1
  exchange_txn_pct: 0.00297
  sebi_turnover_pct: 0.0001
  stamp_duty_pct: 0.015
  gst_pct: 18
  slippage_pct: 0.05

paths:
  data_cache: "data"
  logs: "logs"
  output: "output"
  workbook: "data/breakout.xlsx"   # single Excel workbook, one sheet per table

logging:
  level: "INFO"
  console: true
