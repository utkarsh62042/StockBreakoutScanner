name: Stock Breakout Scanner

on:
  schedule:
    - cron: "15 5 * * 1-5"
    - cron: "50 9 * * 1-5"
    - cron: "30 10 * * 1-5"

  workflow_dispatch:
    inputs:
      job:
        description: "Scanner job to run"
        required: true
        default: "morning_scan"
        type: choice
        options:
          - morning_scan
          - preclose_scan
          - eod_settle

permissions:
  contents: write

concurrency:
  group: stock-breakout-scanner
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run scanner
        env:
          PYTHONPATH: .
          TELEGRAM_BREAKOUT_ALERTS_BOT_TOKEN: ${{ secrets.TELEGRAM_BREAKOUT_ALERTS_BOT_TOKEN }}
          TELEGRAM_BREAKOUT_ALERTS_CHAT_ID: ${{ secrets.TELEGRAM_BREAKOUT_ALERTS_CHAT_ID }}
          TELEGRAM_TRADES_SUMMARY_BOT_TOKEN: ${{ secrets.TELEGRAM_TRADES_SUMMARY_BOT_TOKEN }}
          TELEGRAM_TRADES_SUMMARY_CHAT_ID: ${{ secrets.TELEGRAM_TRADES_SUMMARY_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            JOB="${{ inputs.job }}"
          elif [ "${{ github.event.schedule }}" = "15 5 * * 1-5" ]; then
            JOB="morning_scan"
          elif [ "${{ github.event.schedule }}" = "50 9 * * 1-5" ]; then
            JOB="preclose_scan"
          elif [ "${{ github.event.schedule }}" = "30 10 * * 1-5" ]; then
            JOB="eod_settle"
          else
            echo "Unknown schedule."
            exit 1
          fi

          echo "Running: $JOB"

          python -m breakout.jobs.$JOB

      - name: Save updated workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/breakout.xlsx

          if git diff --cached --quiet; then
            echo "No workbook changes."
          else
            git commit -m "chore: update scanner workbook"
            git push
          fi
