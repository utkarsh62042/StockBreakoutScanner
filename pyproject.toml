[project]
name = "breakout-scanner"
version = "0.1.0"
description = "Local NIFTY 500 swing-trade breakout scanner with integrated paper trading audit"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "yfinance>=0.2.40",
    "smartapi-python>=1.4.5",
    "pyotp>=2.9",
    # smartapi-python imports logzero and websocket-client but doesn't declare
    # them — we have to pull them in ourselves.
    "logzero>=1.7",
    "websocket-client>=1.7",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["breakout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
